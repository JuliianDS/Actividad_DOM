<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./Css/style.css">

    <title>Document</title>
</head>
<body>
    <main class="container mt-3 p-4">
        <section class=" border border-2 border-dark rounded-5 w-25">
            <div class="d-flex  justify-content-center">
                <div class="m-4 circulo3 border border-2 border-danger  shadow-none" ></div>                
            </div>
            <p class="fs-3 text-center text-danger"></p>
            

            <div class="d-flex  justify-content-center">
                <div class="m-4 circulo2 border border-2 border-warning  shadow-none" ></div>                
            </div>
            <p class="fs-3 text-center text-warning"></p>

            <div class="d-flex  justify-content-center">
                <div class="m-4 circulo1 border border-2 border-success  shadow-none" ></div>                
            </div>
            <p class="fs-3 text-center text-success"></p>

        </section>
        <section class="mt-3 p-4 d-flex bg-secondary w-25 justify-content-center rounded-4">
            <button class="btn btn-success">Verde</button>
            <button class="btn btn-warning mx-1">Amarillo</button>
            <button class="btn btn-danger">Rojo</button>
        </section>
    </main>
    <script src="./Js/script.js"></script>
</body>
</html>
