                </select>
            </div>
            <div class="d-flex justify-content-center my-3">
                <button class="btn btn-success">Agregar nueva tarea</button>
            </div>
        </section>
        <h3>Lista de Tareas</h3>
        
        <section class="border border-3 border-success rounded-3 my-3 px-3 bg-white">
            <p id="pendientes"></p>
            <ul>

            </ul>
