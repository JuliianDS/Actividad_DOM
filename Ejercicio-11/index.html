        <section class="container w-50 mt-5 border border-1 rounded">
            <form action="" novalidate>
                <legend>Registro</legend>
                <div class="gap-2 d-flex flex-column">
                    <input id="name" type="text" placeholder="Ingresa tu nombre" class="form-control mt-3">
                    <p class="aviso1 text-danger"></p>
                    <input id="correo" type="email" placeholder="example@email.com" class="form-control mt-3">
                    <p class="aviso2 text-danger"></p>
                    <input id="edad" type="number" placeholder="Ingresa tu edad" class="form-control mt-3">
                    <p class="aviso3 text-danger"></p>
                </div>
                <button class="btn btn-success mt-3 offset-5" type="submit">Registrarse</button>
            </form>
        </section>

    </main>
